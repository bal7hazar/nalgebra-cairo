[package]
name = "nalgebra_static2"
description = "The methods of the dimension-2 shapes (Matrix2, Vector2, RowVector2, Matrix1x2...)."
version.workspace = true
edition.workspace = true
cairo-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["linear-algebra", "fixed-point", "base"]
readme = "README.md"

# `closures` (as in `nalgebra`, which forwards its own feature of that name here): the methods of
# the shapes that take a closure (`map`, `fold`, `apply`, `zip_*`...). On by default; `nalgebra`
# depends on this package with `default-features = false`, so `nalgebra` without its default
# features still leaves them out (features unify per compilation unit, docs/SPLIT.md §1).
[features]
default = ["closures"]
closures = []

[dependencies]
nalgebra_core = { path = "../core", version = "0.3.0" }
nalgebra_types2 = { path = "../types2", version = "0.3.0" }
nalgebra_types3 = { path = "../types3", version = "0.3.0" }
simba.workspace = true

[dev-dependencies]
fixed.workspace = true
snforge_std.workspace = true
assert_macros.workspace = true

[tool]
fmt.workspace = true
scarb.workspace = true
