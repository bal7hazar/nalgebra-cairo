[package]
name = "nalgebra_linalg_core"
description = "Shared linalg kernels: the Householder kernels and steps (`clear_column_unchecked`, `assemble_q`), `reflection_axis_mut`, balancing, the SVD filters, the `exp` Padé message."
version.workspace = true
edition.workspace = true
cairo-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["linear-algebra", "fixed-point", "linalg", "balancing", "householder", "exp", "svd"]
readme = "README.md"

# `svd`, `hessenberg`, `exp` (as in `nalgebra`, whose features of the same names forward to these):
# `svd` gates `linalg::svd*` (on `eigen`); `hessenberg` gates `linalg::hessenberg`,
# `linalg::symmetric_tridiagonal`, `linalg::balancing`, `linalg::householder_steps`; `exp` gates
# `linalg::exp`, `linalg::pow`. On by default; `nalgebra` depends on this package with
# `default-features = false`, so `nalgebra` without its default features still leaves them out
# (features unify per compilation unit, docs/SPLIT.md §1).
[features]
default = ["svd", "hessenberg", "exp"]
svd = []
hessenberg = []
exp = []

[dependencies]
nalgebra_core = { path = "../core", version = "0.1.0" }
nalgebra_types2 = { path = "../types2", version = "0.1.0" }
simba.workspace = true

[dev-dependencies]
fixed.workspace = true
snforge_std.workspace = true
assert_macros.workspace = true

[tool]
fmt.workspace = true
scarb.workspace = true
