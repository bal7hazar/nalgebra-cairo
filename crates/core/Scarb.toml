[package]
name = "nalgebra_core"
description = "The generic trait declarations (MatrixMul, MatrixTrMul, MatrixIndex, Norm, Normed / Unit, MatrixSolve, PermuteRows, GivensRotate, LuSteps, Householder / balancing, TransformMul), errors, fused kernels, and the dimension-1 types (Matrix1, Vector1, Point1, Translation1, Perm1, Reflection1)."
version.workspace = true
edition.workspace = true
cairo-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["linear-algebra", "fixed-point", "base", "geometry", "linalg"]
readme = "README.md"
# `associated_item_constraints`: the `core::iter::Sum` / `Product` impls of the shapes
# (`+Iterator<I>[Item: A]`, DESIGN D10), as in `nalgebra`.
experimental-features = ["associated_item_constraints"]

[dependencies]
simba.workspace = true

[dev-dependencies]
fixed.workspace = true
snforge_std.workspace = true
assert_macros.workspace = true

[tool]
fmt.workspace = true
scarb.workspace = true
