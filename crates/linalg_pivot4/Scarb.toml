[package]
name = "nalgebra_linalg_pivot4"
description = "Column-pivoting QR, full-pivoting LU, LBLᵀ of dimension 4."
version.workspace = true
edition.workspace = true
cairo-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["linear-algebra", "fixed-point", "linalg", "col-piv-qr", "full-piv-lu", "lblt"]
readme = "README.md"

# `full_piv_lu`, `col_piv_qr`, `lblt` (as in `nalgebra`, whose features of the same names forward to
# these): `full_piv_lu` gates `linalg::full_piv_lu`; `col_piv_qr` gates `linalg::col_piv_qr`; `lblt`
# gates `linalg::lblt`. On by default; `nalgebra` depends on this package with `default-features =
# false`, so `nalgebra` without its default features still leaves them out (features unify per
# compilation unit, docs/SPLIT.md §1).
[features]
default = ["full_piv_lu", "col_piv_qr", "lblt"]
full_piv_lu = []
col_piv_qr = []
lblt = []

[dependencies]
nalgebra_core = { path = "../core", version = "0.2.0" }
nalgebra_types2 = { path = "../types2", version = "0.2.0" }
nalgebra_types3 = { path = "../types3", version = "0.2.0" }
nalgebra_types4 = { path = "../types4", version = "0.2.0" }
simba.workspace = true

[dev-dependencies]
fixed.workspace = true
snforge_std.workspace = true
assert_macros.workspace = true

[tool]
fmt.workspace = true
scarb.workspace = true
