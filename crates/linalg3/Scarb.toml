[package]
name = "nalgebra_linalg3"
description = "LU, Cholesky (+ the column updates of dimension 2), LDLᵀ / UDU, QR, inverse of dimension 3; the `Perm3` methods."
version.workspace = true
edition.workspace = true
cairo-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["linear-algebra", "fixed-point", "linalg", "cholesky", "cholesky-update", "inverse", "lu", "qr"]
readme = "README.md"

# `qr`, `cholesky_update` (as in `nalgebra`, whose features of the same names forward to these):
# `qr` gates `linalg::qr`; `cholesky_update` gates `linalg::cholesky_update`. On by default;
# `nalgebra` depends on this package with `default-features = false`, so `nalgebra` without its
# default features still leaves them out (features unify per compilation unit, docs/SPLIT.md §1).
[features]
default = ["qr", "cholesky_update"]
qr = ["nalgebra_linalg2/qr"]
cholesky_update = []

[dependencies]
nalgebra_core = { path = "../core", version = "0.1.1" }
nalgebra_types2 = { path = "../types2", version = "0.1.1" }
nalgebra_types3 = { path = "../types3", version = "0.1.1" }
nalgebra_static3 = { path = "../static3", version = "0.1.1", default-features = false }
nalgebra_linalg2 = { path = "../linalg2", version = "0.1.1", default-features = false }
simba.workspace = true

[dev-dependencies]
fixed.workspace = true
snforge_std.workspace = true
assert_macros.workspace = true

[tool]
fmt.workspace = true
scarb.workspace = true
