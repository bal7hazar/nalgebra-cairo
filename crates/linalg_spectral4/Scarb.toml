[package]
name = "nalgebra_linalg_spectral4"
description = "Bidiagonal, Schur, eigen, Hessenberg, symmetric tridiagonal, balancing, exp / pow up to 4x4."
version.workspace = true
edition.workspace = true
cairo-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["linear-algebra", "fixed-point", "linalg", "schur", "hessenberg", "bidiagonal", "balancing"]
readme = "README.md"

# `hessenberg`, `bidiagonal`, `schur`, `exp` (as in `nalgebra`, whose features of the same names
# forward to these): `linalg::hessenberg`, `linalg::symmetric_tridiagonal` and `linalg::balancing`;
# `linalg::bidiagonal`; `linalg::schur` and `linalg::eigen` (on `hessenberg`); `linalg::exp` and
# `linalg::pow`, each up to 4x4. On by default; `nalgebra` depends on this package with
# `default-features = false`, so `nalgebra` without its default features still leaves them out
# (features unify per compilation unit, docs/SPLIT.md §1).
[features]
default = ["hessenberg", "bidiagonal", "schur", "exp"]
hessenberg = []
bidiagonal = []
schur = ["hessenberg"]
exp = []

[dependencies]
nalgebra_core = { path = "../core", version = "0.1.0" }
nalgebra_linalg4 = { path = "../linalg4", version = "0.1.0", default-features = false }
nalgebra_shapes5 = { path = "../shapes5", version = "0.1.0" }
nalgebra_static3 = { path = "../static3", version = "0.1.0", default-features = false }
nalgebra_static4 = { path = "../static4", version = "0.1.0", default-features = false }
simba.workspace = true

[dev-dependencies]
fixed.workspace = true
snforge_std.workspace = true
assert_macros.workspace = true

[tool]
fmt.workspace = true
scarb.workspace = true
