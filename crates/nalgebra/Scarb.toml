[package]
name = "nalgebra"
description = "Linear algebra for provable game physics: a Cairo port of the Rust nalgebra crate."
version.workspace = true
edition.workspace = true
cairo-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true

# Families that cost compile memory to every dependent and that nothing else in the crate uses
# (WP 8.1d, tools/shapegen/DESIGN.md §2.11): all on by default, so the public API is upstream's; a
# dependent that does not need them writes `default-features = false` (plus `features = [..]`).
# `statistics`: base/statistics.cairo; `blas`: base/blas.cairo; `closures`: the methods of the
# shapes that take a closure (`map`, `fold`, `apply`, `zip_*`...). `dynamic` (WP 8.5-P13, DESIGN
# D5): `DMatrix` / `DVector` / `RowDVector`, the partially dynamic aliases, the edition forms
# of the static shapes that return them and the vector convolutions (base/dynamic*.cairo).
# `sparse` (WP 8.6-P20): upstream's legacy `nalgebra::sparse` (`CsMatrix`, `CsCholesky`,
# sparse/**), on top of `dynamic`; `io` (WP 8.6-P20): `nalgebra::io`, the Matrix Market parser
# (io/**), on top of `sparse`. The linalg families (WP 8.5-P15; measured saving on a cold build
# without the defaults): `eigen` (linalg/symmetric_eigen*, 0.11 GB), `svd` (linalg/svd*, on top of
# `eigen`, 0.52 GB more), `qr` (linalg/qr*, 0.23 GB), `cholesky_update` (0.02 GB: its own test
# package is its only user, grouping it would make another package compile it), `full_piv_lu`
# (0.29 GB), `col_piv_qr` (0.43 GB), `lblt` (0.09 GB). Nothing ungated uses them (`Lu6`, used by
# `Matrix6`, stays ungated with `lu`, `cholesky`, `udu`). WP 8.5-P16: `hessenberg`
# (linalg/hessenberg*, the Householder building blocks, and, grouped with it because each saves
# less than 0.1 GB, linalg/symmetric_tridiagonal* and linalg/balancing: 0.19 GB), `bidiagonal`
# (linalg/bidiagonal*, 0.37 GB), `schur` (linalg/schur*, linalg/eigen*, on top of `hessenberg`,
# 0.22 GB more).
[features]
default = [
    "statistics", "blas", "closures", "dynamic", "sparse", "io", "eigen", "svd", "qr",
    "cholesky_update", "full_piv_lu", "col_piv_qr", "lblt", "hessenberg", "bidiagonal", "schur",
]
statistics = []
blas = []
closures = []
dynamic = []
sparse = ["dynamic"]
io = ["sparse"]
eigen = []
svd = ["eigen"]
qr = []
cholesky_update = []
full_piv_lu = []
col_piv_qr = []
lblt = []
hessenberg = []
bidiagonal = []
schur = ["hessenberg"]

[dependencies]
simba.workspace = true

[dev-dependencies]
fixed.workspace = true
snforge_std.workspace = true
assert_macros.workspace = true
nalgebra_testing = { path = "../testing" }

[tool]
fmt.workspace = true
scarb.workspace = true
