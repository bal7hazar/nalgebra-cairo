    "nalgebra_linalg_svd_eigen3/svd", "nalgebra_linalg_svd_eigen4/svd",
    "nalgebra_linalg_svd_eigen5/svd", "nalgebra_linalg_svd_eigen6/svd",
]
qr = [
    "nalgebra_linalg2/qr", "nalgebra_linalg3/qr", "nalgebra_linalg4/qr", "nalgebra_linalg5/qr",
    "nalgebra_linalg6/qr",
]
cholesky_update = [
    "nalgebra_linalg3/cholesky_update", "nalgebra_linalg4/cholesky_update",
    "nalgebra_linalg6/cholesky_update",
]
full_piv_lu = [
    "nalgebra_linalg_pivot2/full_piv_lu", "nalgebra_linalg_pivot3/full_piv_lu",
    "nalgebra_linalg_pivot4/full_piv_lu", "nalgebra_linalg_pivot5/full_piv_lu",
    "nalgebra_linalg_pivot6/full_piv_lu",
]
col_piv_qr = [
    "nalgebra_linalg_pivot2/col_piv_qr", "nalgebra_linalg_pivot3/col_piv_qr",
    "nalgebra_linalg_pivot4/col_piv_qr", "nalgebra_linalg_pivot5/col_piv_qr",
    "nalgebra_linalg_pivot6/col_piv_qr",
]
lblt = [
    "nalgebra_linalg_pivot2/lblt", "nalgebra_linalg_pivot3/lblt", "nalgebra_linalg_pivot4/lblt",
    "nalgebra_linalg_pivot5/lblt", "nalgebra_linalg_pivot6/lblt",
]
macros = []
hessenberg = [
    "nalgebra_linalg_core/hessenberg", "nalgebra_linalg_spectral2/hessenberg",
    "nalgebra_linalg_spectral3/hessenberg", "nalgebra_linalg_spectral4/hessenberg",
    "nalgebra_linalg_spectral5/hessenberg", "nalgebra_linalg_spectral6/hessenberg",
]
bidiagonal = [
    "nalgebra_linalg_spectral2/bidiagonal", "nalgebra_linalg_spectral3/bidiagonal",
    "nalgebra_linalg_spectral4/bidiagonal", "nalgebra_linalg_spectral5/bidiagonal",
    "nalgebra_linalg_spectral6/bidiagonal",
]
schur = [
    "hessenberg", "nalgebra_linalg_spectral2/schur", "nalgebra_linalg_spectral3/schur",
    "nalgebra_linalg_spectral4/schur", "nalgebra_linalg_spectral5/schur",
    "nalgebra_linalg_spectral6/schur",
]
exp = [
    "nalgebra_linalg_core/exp", "nalgebra_linalg_spectral2/exp", "nalgebra_linalg_spectral3/exp",
    "nalgebra_linalg_spectral4/exp", "nalgebra_linalg_spectral5/exp",
    "nalgebra_linalg_spectral6/exp",
]

