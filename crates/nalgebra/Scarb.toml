[package]
name = "nalgebra"
description = "Linear algebra for provable game physics: a Cairo port of the Rust nalgebra crate."
version.workspace = true
edition.workspace = true
cairo-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
readme = "../../README.md"
# DESIGN D10 (owner, 2026-09-26): `associated_item_constraints` for the `core::iter::Sum` /
# `Product` impls (`+Iterator<I>[Item: A]`), `user_defined_inline_macros` for the construction
# macros (`matrix!`, `vector!`, `point!`, `dmatrix!`, `dvector!`, `stack!`, src/macros.cairo). A
# dependent calls the macros without enabling either feature (measured, WP 8.6-P21, README).
experimental-features = ["associated_item_constraints", "user_defined_inline_macros"]

# Families that cost compile memory to every dependent and that nothing else in the crate uses
# (WP 8.1d, tools/shapegen/DESIGN.md §2.11): all on by default, so the public API is upstream's; a
# dependent that does not need them writes `default-features = false` (plus `features = [..]`).
# `statistics`: base/statistics.cairo; `blas`: base/blas.cairo (WP 9-NS8: their code lives in
# `nalgebra_statistics` / `nalgebra_blas`, which this package always depends on; the features now
# gate the facade's re-exports of those crates only, so `default-features = false` still exposes no
# statistics / BLAS item as in 0.1.0; their removal is decided with the other no-op features,
# docs/SPLIT.md §12.1); `closures`: the methods of the
# shapes that take a closure (`map`, `fold`, `apply`, `zip_*`...). `dynamic` (WP 8.5-P13, DESIGN
# D5): `DMatrix` / `DVector` / `RowDVector`, the partially dynamic aliases, the edition forms
# of the static shapes that return them and the vector convolutions (base/dynamic*.cairo).
# `sparse` (WP 8.6-P20): upstream's legacy `nalgebra::sparse` (`CsMatrix`, `CsCholesky`,
# sparse/**), on top of `dynamic`; `io` (WP 8.6-P20): `nalgebra::io`, the Matrix Market parser
# (io/**), on top of `sparse`. The linalg families (WP 8.5-P15; measured saving on a cold build
# without the defaults): `eigen` (linalg/symmetric_eigen*, 0.11 GB), `svd` (linalg/svd*, on top of
# `eigen`, 0.52 GB more), `qr` (linalg/qr*, 0.23 GB), `cholesky_update` (0.02 GB: its own test
# package is its only user, grouping it would make another package compile it), `full_piv_lu`
# (0.29 GB), `col_piv_qr` (0.43 GB), `lblt` (0.09 GB). Nothing ungated uses them (`Lu6`, used by
# `Matrix6`, stays ungated with `lu`, `cholesky`, `udu`). `macros` (WP 8.6-P21): upstream's
# feature of the same name, the construction macros and the block traits `stack!` expands to
# (src/macros.cairo, 0.3 GB); `dmatrix!` / `dvector!` also need `dynamic`. WP 8.5-P16:
# `hessenberg` (linalg/hessenberg*, the Householder building blocks, and, grouped with it because
# each saves less than 0.1 GB, linalg/symmetric_tridiagonal* and linalg/balancing: 0.19 GB),
# `bidiagonal` (linalg/bidiagonal*, 0.37 GB), `schur` (linalg/schur*, linalg/eigen*, on top of
# `hessenberg`, 0.40 GB more). WP 8.5-P17: `exp` (linalg/exp.cairo, the matrix exponential, and,
# grouped with it because each saves less than 0.1 GB, linalg/pow.cairo, the integer power:
# 0.03 GB together). WP 9-NS9: the linalg families up to 4x4 live in `nalgebra_linalg4`,
# `nalgebra_linalg_svd_eigen4`, `nalgebra_linalg_pivot4` and `nalgebra_linalg_spectral4`, which this
# package depends on with `default-features = false`: each linalg feature above still gates the
# dimension-5 / 6 code this package hosts and its re-exports, and forwards to the feature of the same
# name of the sub-crate that holds its part up to 4x4 (`hessenberg` to both `nalgebra_linalg4`,
# `householder_steps`, and `nalgebra_linalg_spectral4`), so `default-features = false` still leaves
# them out.
[features]
default = [
    "statistics", "blas", "closures", "dynamic", "sparse", "io", "eigen", "svd", "qr",
    "cholesky_update", "full_piv_lu", "col_piv_qr", "lblt", "macros", "hessenberg", "bidiagonal",
    "schur", "exp",
]
statistics = []
blas = []
closures = [
    "nalgebra_static3/closures", "nalgebra_static4/closures", "nalgebra_static5/closures",
    "nalgebra_static6_tall/closures", "nalgebra_static6_wide/closures",
]
dynamic = []
sparse = ["dynamic"]
io = ["sparse"]
eigen = [
    "nalgebra_linalg_svd_eigen4/eigen", "nalgebra_linalg5/eigen", "nalgebra_linalg6/eigen",
]
svd = ["eigen", "nalgebra_linalg_svd_eigen4/svd", "nalgebra_linalg5/svd", "nalgebra_linalg6/svd"]
qr = ["nalgebra_linalg4/qr", "nalgebra_linalg5/qr", "nalgebra_linalg6/qr"]
cholesky_update = ["nalgebra_linalg4/cholesky_update", "nalgebra_linalg6/cholesky_update"]
full_piv_lu = [
    "nalgebra_linalg_pivot4/full_piv_lu", "nalgebra_linalg_pivot5/full_piv_lu", "nalgebra_linalg_pivot6/full_piv_lu",
]
col_piv_qr = [
    "nalgebra_linalg_pivot4/col_piv_qr", "nalgebra_linalg_pivot5/col_piv_qr", "nalgebra_linalg_pivot6/col_piv_qr",
]
lblt = [
    "nalgebra_linalg_pivot4/lblt", "nalgebra_linalg_pivot5/lblt", "nalgebra_linalg_pivot6/lblt",
]
macros = []
hessenberg = [
    "nalgebra_linalg4/hessenberg", "nalgebra_linalg_spectral4/hessenberg",
    "nalgebra_linalg_spectral5/hessenberg", "nalgebra_linalg_spectral6/hessenberg",
]
bidiagonal = [
    "nalgebra_linalg_spectral4/bidiagonal", "nalgebra_linalg_spectral5/bidiagonal", "nalgebra_linalg_spectral6/bidiagonal",
]
schur = [
    "hessenberg", "nalgebra_linalg_spectral4/schur", "nalgebra_linalg_spectral5/schur",
    "nalgebra_linalg_spectral6/schur",
]
exp = [
    "nalgebra_linalg_spectral4/exp", "nalgebra_linalg_spectral5/exp", "nalgebra_linalg_spectral6/exp",
]

[dependencies]
nalgebra_core = { path = "../core", version = "0.1.0" }
nalgebra_static3 = { path = "../static3", version = "0.1.0", default-features = false }
nalgebra_shapes5 = { path = "../shapes5", version = "0.1.0" }
nalgebra_static4 = { path = "../static4", version = "0.1.0", default-features = false }
nalgebra_geometry4 = { path = "../geometry4", version = "0.1.0" }
nalgebra_shapes6 = { path = "../shapes6", version = "0.1.0" }
nalgebra_static5 = { path = "../static5", version = "0.1.0", default-features = false }
nalgebra_static6_tall = { path = "../static6_tall", version = "0.1.0", default-features = false }
nalgebra_static6_wide = { path = "../static6_wide", version = "0.1.0", default-features = false }
nalgebra_blocks = { path = "../blocks", version = "0.1.0" }
nalgebra_views = { path = "../views", version = "0.1.0" }
nalgebra_norm = { path = "../norm", version = "0.1.0" }
nalgebra_geometry6 = { path = "../geometry6", version = "0.1.0" }
nalgebra_statistics = { path = "../statistics", version = "0.1.0" }
nalgebra_blas = { path = "../blas", version = "0.1.0" }
nalgebra_linalg4 = { path = "../linalg4", version = "0.1.0", default-features = false }
nalgebra_linalg_svd_eigen4 = { path = "../linalg_svd_eigen4", version = "0.1.0", default-features = false }
nalgebra_linalg_pivot4 = { path = "../linalg_pivot4", version = "0.1.0", default-features = false }
nalgebra_linalg_spectral4 = { path = "../linalg_spectral4", version = "0.1.0", default-features = false }
nalgebra_linalg5 = { path = "../linalg5", version = "0.1.0", default-features = false }
nalgebra_linalg_pivot5 = { path = "../linalg_pivot5", version = "0.1.0", default-features = false }
nalgebra_linalg_spectral5 = { path = "../linalg_spectral5", version = "0.1.0", default-features = false }
nalgebra_linalg6 = { path = "../linalg6", version = "0.1.0", default-features = false }
nalgebra_linalg_pivot6 = { path = "../linalg_pivot6", version = "0.1.0", default-features = false }
nalgebra_linalg_spectral6 = { path = "../linalg_spectral6", version = "0.1.0", default-features = false }
simba.workspace = true

[dev-dependencies]
fixed.workspace = true
snforge_std.workspace = true
assert_macros.workspace = true

[tool]
fmt.workspace = true
scarb.workspace = true
