[package]
name = "nalgebra_linalg5"
description = "QR of dimension 5; the `Perm5` methods (0.1.0 has no `Lu5`, `Cholesky5` or `Udu5`)."
version.workspace = true
edition.workspace = true
cairo-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["linear-algebra", "fixed-point", "linalg", "lu", "qr"]
readme = "README.md"

# `qr` (as in `nalgebra`, whose features of the same names forward to these): `qr` gates
# `linalg::qr`. On by default; `nalgebra` depends on this package with `default-features = false`,
# so `nalgebra` without its default features still leaves them out (features unify per compilation
# unit, docs/SPLIT.md §1).
[features]
default = ["qr"]
qr = []

[dependencies]
nalgebra_core = { path = "../core", version = "0.3.0" }
nalgebra_types2 = { path = "../types2", version = "0.3.0" }
nalgebra_types3 = { path = "../types3", version = "0.3.0" }
nalgebra_types4 = { path = "../types4", version = "0.3.0" }
nalgebra_types5 = { path = "../types5", version = "0.3.0" }
simba.workspace = true

[dev-dependencies]
fixed.workspace = true
snforge_std.workspace = true
assert_macros.workspace = true

[tool]
fmt.workspace = true
scarb.workspace = true
