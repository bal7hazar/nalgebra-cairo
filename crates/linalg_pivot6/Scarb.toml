[package]
name = "nalgebra_linalg_pivot6"
description = "Column-pivoting QR, full-pivoting LU, LBLᵀ of dimension 6."
version.workspace = true
edition.workspace = true
cairo-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["linear-algebra", "fixed-point", "linalg", "col-piv-qr", "full-piv-lu", "lblt"]
readme = "README.md"

# `full_piv_lu`, `col_piv_qr`, `lblt` (as in `nalgebra`, whose features of the same names forward to
# these): `linalg::full_piv_lu`, `linalg::col_piv_qr` and `linalg::lblt` of dimension 6. On by
# default; `nalgebra` depends on this package with `default-features = false`, so `nalgebra` without
# its default features still leaves them out (features unify per compilation unit, docs/SPLIT.md
# §1).
[features]
default = ["full_piv_lu", "col_piv_qr", "lblt"]
full_piv_lu = []
col_piv_qr = []
lblt = []

[dependencies]
nalgebra_core = { path = "../core", version = "0.1.0" }
nalgebra_shapes5 = { path = "../shapes5", version = "0.1.0" }
nalgebra_shapes6 = { path = "../shapes6", version = "0.1.0" }
nalgebra_static6_wide = { path = "../static6_wide", version = "0.1.0", default-features = false }
simba.workspace = true

[dev-dependencies]
fixed.workspace = true
snforge_std.workspace = true
assert_macros.workspace = true

[tool]
fmt.workspace = true
scarb.workspace = true
