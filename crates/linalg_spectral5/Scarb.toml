[package]
name = "nalgebra_linalg_spectral5"
description = "Bidiagonal, Schur, eigen, Hessenberg, tridiagonal of dimension 5."
version.workspace = true
edition.workspace = true
cairo-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["linear-algebra", "fixed-point", "linalg", "schur", "hessenberg", "bidiagonal", "eigen"]
readme = "README.md"

# `hessenberg`, `bidiagonal`, `schur`, `exp` (as in `nalgebra`, whose features of the same names
# forward to these): `linalg::hessenberg` and `linalg::symmetric_tridiagonal`; `linalg::bidiagonal`;
# `linalg::schur` and `linalg::eigen` (on `hessenberg`); `linalg::exp` and `linalg::pow`, each of
# dimension 5. On by default; `nalgebra` depends on this package with `default-features = false`, so
# `nalgebra` without its default features still leaves them out (features unify per compilation
# unit, docs/SPLIT.md §1).
[features]
default = ["hessenberg", "bidiagonal", "schur", "exp"]
hessenberg = []
bidiagonal = []
schur = ["hessenberg"]
exp = ["nalgebra_linalg_spectral4/exp"]

[dependencies]
nalgebra_core = { path = "../core", version = "0.1.0" }
nalgebra_types2 = { path = "../types2", version = "0.1.0" }
nalgebra_types3 = { path = "../types3", version = "0.1.0" }
nalgebra_types4 = { path = "../types4", version = "0.1.0" }
nalgebra_types5 = { path = "../types5", version = "0.1.0" }
nalgebra_static5 = { path = "../static5", version = "0.1.0", default-features = false }
nalgebra_linalg4 = { path = "../linalg4", version = "0.1.0", default-features = false }
nalgebra_linalg_spectral4 = { path = "../linalg_spectral4", version = "0.1.0", default-features = false }
simba.workspace = true

[dev-dependencies]
fixed.workspace = true
snforge_std.workspace = true
assert_macros.workspace = true

[tool]
fmt.workspace = true
scarb.workspace = true
