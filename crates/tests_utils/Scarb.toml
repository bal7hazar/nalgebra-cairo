[package]
name = "nalgebra_tests_utils"
description = "Test-only builders and comparisons shared by the nalgebra test packages (not published)."
version.workspace = true
edition.workspace = true
cairo-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
publish = false

# The comparisons of the decompositions behind a `nalgebra` feature (DESIGN D9) are behind the
# feature of the same name here: a test package that enables `nalgebra`'s `qr` / `svd` enables
# them on this helper too (`nalgebra_tests_utils = { .., features = ["qr"] }`).
[features]
qr = []
svd = []

[dependencies]
nalgebra = { path = "../nalgebra", default-features = false }
simba.workspace = true
fixed.workspace = true

[dev-dependencies]
snforge_std.workspace = true
assert_macros.workspace = true

[tool]
fmt.workspace = true
scarb.workspace = true
