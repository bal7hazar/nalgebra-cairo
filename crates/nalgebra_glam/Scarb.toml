[package]
name = "nalgebra_glam"
description = "Conversions between nalgebra-cairo and glam-cairo types: the glam interop of the Rust nalgebra crate (its `convert-glam` features) as a separate package."
version.workspace = true
edition.workspace = true
cairo-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
readme = "README.md"

[dependencies]
nalgebra_core = { path = "../core", version = "0.3.0" }
nalgebra_types2 = { path = "../types2", version = "0.3.0" }
nalgebra_types3 = { path = "../types3", version = "0.3.0" }
nalgebra_types4 = { path = "../types4", version = "0.3.0" }
nalgebra_static2 = { path = "../static2", version = "0.3.0", default-features = false }
nalgebra_static3 = { path = "../static3", version = "0.3.0", default-features = false }
nalgebra_geometry2 = { path = "../geometry2", version = "0.3.0" }
nalgebra_geometry3 = { path = "../geometry3", version = "0.3.0" }
glam_core = "0.5.0"
fixed.workspace = true

[dev-dependencies]
snforge_std.workspace = true
assert_macros.workspace = true

[tool]
fmt.workspace = true
scarb.workspace = true
