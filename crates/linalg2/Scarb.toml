[package]
name = "nalgebra_linalg2"
description = "LU, Cholesky, LDLᵀ / UDU, QR, inverse of dimension 2 (and 1); the `Perm1` / `Perm2` methods."
version.workspace = true
edition.workspace = true
cairo-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["linear-algebra", "fixed-point", "linalg", "cholesky", "inverse", "lu", "qr", "udu"]
readme = "README.md"

# `qr` (as in `nalgebra`, whose features of the same names forward to these): `qr` gates
# `linalg::qr`. On by default; `nalgebra` depends on this package with `default-features = false`,
# so `nalgebra` without its default features still leaves them out (features unify per compilation
# unit, docs/SPLIT.md §1).
[features]
default = ["qr"]
qr = []

[dependencies]
nalgebra_core = { path = "../core", version = "0.2.0" }
nalgebra_types2 = { path = "../types2", version = "0.2.0" }
nalgebra_static2 = { path = "../static2", version = "0.2.0", default-features = false }
simba.workspace = true

[dev-dependencies]
fixed.workspace = true
snforge_std.workspace = true
assert_macros.workspace = true

[tool]
fmt.workspace = true
scarb.workspace = true
