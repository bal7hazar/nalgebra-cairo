[package]
name = "nalgebra_linalg6"
description = "Cholesky (+ its column updates), LDLᵀ / UDU, QR, inverse of dimension 6 (`Lu6` is in `static6_wide`)."
version.workspace = true
edition.workspace = true
cairo-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["linear-algebra", "fixed-point", "linalg", "cholesky", "cholesky-update", "inverse", "qr", "udu"]
readme = "README.md"

# `qr`, `cholesky_update` (as in `nalgebra`, whose features of the same names forward to these):
# `qr` gates `linalg::qr`; `cholesky_update` gates `linalg::cholesky_update`. On by default;
# `nalgebra` depends on this package with `default-features = false`, so `nalgebra` without its
# default features still leaves them out (features unify per compilation unit, docs/SPLIT.md §1).
[features]
default = ["qr", "cholesky_update"]
qr = []
cholesky_update = []

[dependencies]
nalgebra_core = { path = "../core", version = "0.1.0" }
nalgebra_types2 = { path = "../types2", version = "0.1.0" }
nalgebra_types3 = { path = "../types3", version = "0.1.0" }
nalgebra_types4 = { path = "../types4", version = "0.1.0" }
nalgebra_types5 = { path = "../types5", version = "0.1.0" }
nalgebra_types6 = { path = "../types6", version = "0.1.0" }
nalgebra_static6_wide = { path = "../static6_wide", version = "0.1.0", default-features = false }
simba.workspace = true

[dev-dependencies]
fixed.workspace = true
snforge_std.workspace = true
assert_macros.workspace = true

[tool]
fmt.workspace = true
scarb.workspace = true
