[package]
name = "nalgebra_dynamic"
description = "DMatrix, DVector, RowDVector, the dynamic forms of the static shapes."
version.workspace = true
edition.workspace = true
cairo-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["linear-algebra", "fixed-point", "base", "dynamic", "dmatrix"]
readme = "README.md"
# `associated_item_constraints`: the `core::iter::Sum` impls of `DMatrix` / `DVector`
# (`+Iterator<I>[Item: A]`, DESIGN D10), as in `nalgebra`.
experimental-features = ["associated_item_constraints"]

# `closures` (as in `nalgebra`, which forwards its own feature of that name here): the methods of
# the dynamic matrices and of the dynamic forms of the static shapes that take a closure (`map`,
# `fold`, `apply`, `zip_*`...). On by default; `nalgebra` and `nalgebra_sparse` depend on this
# package with `default-features = false`, so `nalgebra` without its default features still leaves
# them out (features unify per compilation unit, docs/SPLIT.md §1). WP 9-NS12b (decision D1): it no
# longer forwards to the static method crates, whose closure-taking methods none of these call (a
# user of their traits depends on them directly, with their own default `closures`; the facade
# forwards to each of them).
[features]
default = ["closures"]
closures = []

[dependencies]
nalgebra_core = { path = "../core", version = "0.1.0" }
nalgebra_types2 = { path = "../types2", version = "0.1.0" }
nalgebra_types3 = { path = "../types3", version = "0.1.0" }
nalgebra_types4 = { path = "../types4", version = "0.1.0" }
nalgebra_types5 = { path = "../types5", version = "0.1.0" }
nalgebra_types6 = { path = "../types6", version = "0.1.0" }
nalgebra_static_core = { path = "../static_core", version = "0.1.0", default-features = false }
nalgebra_static2 = { path = "../static2", version = "0.1.0", default-features = false }
nalgebra_static3 = { path = "../static3", version = "0.1.0", default-features = false }
nalgebra_static4 = { path = "../static4", version = "0.1.0", default-features = false }
nalgebra_static5 = { path = "../static5", version = "0.1.0", default-features = false }
nalgebra_static6_tall = { path = "../static6_tall", version = "0.1.0", default-features = false }
nalgebra_static6_wide = { path = "../static6_wide", version = "0.1.0", default-features = false }
simba.workspace = true

[dev-dependencies]
fixed.workspace = true
snforge_std.workspace = true
assert_macros.workspace = true

[tool]
fmt.workspace = true
scarb.workspace = true
