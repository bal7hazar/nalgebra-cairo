[package]
name = "nalgebra_linalg_svd_eigen4"
description = "Symmetric eigendecomposition and SVD up to 4x4."
version.workspace = true
edition.workspace = true
cairo-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["linear-algebra", "fixed-point", "linalg", "svd", "symmetric-eigen"]
readme = "README.md"

# `eigen`, `svd` (as in `nalgebra`, whose features of the same names forward to these):
# `linalg::symmetric_eigen1..4` and `linalg::svd*` up to 4 columns and rows (`svd` builds on
# `eigen`). On by default; `nalgebra` depends on this package with `default-features = false`, so
# `nalgebra` without its default features still leaves them out (features unify per compilation
# unit, docs/SPLIT.md §1).
[features]
default = ["eigen", "svd"]
eigen = []
svd = ["eigen"]

[dependencies]
nalgebra_core = { path = "../core", version = "0.1.0" }
nalgebra_static3 = { path = "../static3", version = "0.1.0", default-features = false }
simba.workspace = true

[dev-dependencies]
fixed.workspace = true
snforge_std.workspace = true
assert_macros.workspace = true

[tool]
fmt.workspace = true
scarb.workspace = true
