[workspace.package]
version = "0.2.0"
edition = "2024_07"
cairo-version = "2.20.0"
authors = ["bal7hazar"]
license = "MIT"
repository = "https://github.com/bal7hazar/nalgebra-cairo"
keywords = ["math", "linear-algebra", "fixed-point", "physics", "gamedev"]

[workspace.dependencies]
simba = "0.2.0"
fixed = "0.4.0"
snforge_std = "0.64.0"
assert_macros = "2.20.0"

[workspace.tool.fmt]
sort-module-level-items = true
max-line-length = 100

[workspace.tool.scarb]
allow-prebuilt-plugins = ["snforge_std"]
