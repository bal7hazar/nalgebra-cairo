    "crates/shapes_tests_core",
    "crates/shapes_tests_norms",
    "crates/shapes_tests_componentwise",
    "crates/shapes_tests_construction",
    "crates/shapes_tests_structure",
    "crates/shapes_tests_functional",
    "crates/shapes_tests_edition",
    "crates/shapes_tests_inplace",
    "crates/shapes_tests_views",
    "crates/shapes_tests_blocks",
    "crates/shapes_tests_cg",
    "crates/shapes_tests_stats",
    "crates/shapes_tests_blas",
    "crates/shapes_tests_gemm",
    "crates/shapes_tests_gemm_large",
    "crates/tests_utils",
    "crates/tests_base",
    "crates/tests_geometry",
    "crates/tests_geometry_ext",
    "crates/tests_geometry_poses",
    "crates/tests_geometry_scale",
    "crates/tests_geometry_dual",
    "crates/tests_geometry_projections",
    "crates/tests_geometry_transform",
    "crates/tests_linalg",
    "crates/tests_linalg_solve",
    "crates/tests_linalg_solve_rhs",
    "crates/tests_linalg_factor",
    "crates/tests_linalg_eigen",
    "crates/tests_linalg_qr",
    "crates/tests_linalg_qr_tall",
    "crates/tests_linalg_qr6",
    "crates/tests_linalg_cholesky_update",
    "crates/tests_linalg_svd",
    "crates/tests_linalg_svd5",
    "crates/tests_linalg_svd6",
    "crates/tests_linalg_svd_tall",
    "crates/tests_linalg_svd_tall5",
    "crates/tests_linalg_svd_tall6",
    "crates/tests_linalg_svd_tall6b",
    "crates/tests_linalg_svd_wide",
    "crates/tests_linalg_svd_wide5",
    "crates/tests_linalg_svd_wide6",
    "crates/tests_linalg_svd_wide6b",
    "crates/tests_linalg_pivot_lu",
    "crates/tests_linalg_pivot_lu_wide",
    "crates/tests_linalg_pivot_lu_tall",
    "crates/tests_linalg_pivot_qr",
    "crates/tests_linalg_pivot_qr_wide",
    "crates/tests_linalg_pivot_qr_tall",
    "crates/tests_linalg_pivot_lblt",
    "crates/tests_dynamic",
    "crates/tests_sparse",
]

[workspace.package]
version = "0.1.0"
edition = "2024_07"
cairo-version = "2.19.4"
authors = ["bal7hazar"]
license = "MIT"
repository = "https://github.com/bal7hazar/nalgebra-cairo"
keywords = ["math", "linear-algebra", "fixed-point", "physics", "gamedev"]

[workspace.dependencies]
simba = "0.2.0"
fixed = "0.4.0"
snforge_std = "0.61.0"
assert_macros = "2.19.4"

[workspace.tool.fmt]
sort-module-level-items = true
max-line-length = 100

[workspace.tool.scarb]
allow-prebuilt-plugins = ["snforge_std"]
