[workspace]
members = [
    "crates/nalgebra",
    "crates/testing",
    "crates/shapes_tests_core",
    "crates/shapes_tests_norms",
    "crates/shapes_tests_componentwise",
    "crates/shapes_tests_construction",
    "crates/shapes_tests_structure",
    "crates/shapes_tests_functional",
    "crates/shapes_tests_edition",
    "crates/shapes_tests_inplace",
    "crates/shapes_tests_views",
    "crates/shapes_tests_blocks",
    "crates/tests_utils",
    "crates/tests_base",
    "crates/tests_geometry",
    "crates/tests_geometry_ext",
    "crates/tests_geometry_poses",
    "crates/tests_geometry_scale",
    "crates/tests_geometry_dual",
    "crates/tests_geometry_projections",
    "crates/tests_linalg",
]

[workspace.package]
version = "0.1.0"
edition = "2024_07"
cairo-version = "2.19.4"
authors = ["bal7hazar"]
license = "MIT"
repository = "https://github.com/bal7hazar/nalgebra-cairo"
keywords = ["math", "linear-algebra", "fixed-point", "physics", "gamedev"]

[workspace.dependencies]
simba = "0.1.0"
snforge_std = "0.61.0"
assert_macros = "2.19.4"

[workspace.tool.fmt]
sort-module-level-items = true
max-line-length = 100

[workspace.tool.scarb]
allow-prebuilt-plugins = ["snforge_std"]
