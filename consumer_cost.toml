# Gates and closures of scripts/consumer_cost.py (see the docstring at the top of that script).
# The values below are the defaults of the package granularity rule (a published crate: at most
# 40,000 library lines; an empty consumer of it adds at most 5 s / 1 GB to the no-dependency
# build; a typical closure at most 15 s / 3 GB).

# Crates judged on the closure budget only (gate 3): facades that re-export others (or
# `--facade umbrella` on the command line, repeatable). WP 9-NS11b: the facade `nalgebra` depends on
# every sub-crate (Scarb has no optional dependency), so it fails gate 3 by construction; the
# programme session accepted it (docs/SPLIT.md §12.1): measured and shown, never gated
# (`report_only`), the light builds depend on the sub-crates.
facades = ["nalgebra"]

[gates]
max_lines = 40000
max_seconds = 5
max_gb = 1
closure_seconds = 15
closure_gb = 3

[crates.nalgebra]
report_only = true

# "Typical closures": the crates a consumer of a product pulls in together, measured by one
# consumer that depends on all of them (`--closure NAME=a,b` adds more on the command line). A
# member is a workspace crate by name ("nalgebra_glam") or a registry crate with its version
# requirement ("glam@0.4.1", "fixed@0.4.0").
#
# A closure is a list of members, or a table `{ members = [..], default_features = false,
# features = [..], report_only = true }` (the configuration of its workspace members; a
# `report_only` closure is measured for the documentation, never gated).
[closures]
# The facade with `nalgebra_glam` and the facade without its default features (docs/SPLIT.md §4,
# §12.1: the cost regression of `default-features = false`): reported for the CHANGELOG.
nalgebra_with_glam = { members = ["nalgebra", "nalgebra_glam"], report_only = true }
facade_no_default_features = { members = ["nalgebra"], default_features = false, report_only = true }
# WP 9-NS4: `nalgebra_glam` on the sub-crates (docs/SPLIT.md §8)
# (WP 9-NS5: `glam_int` dropped, docs/SPLIT.md §15)
nalgebra_glam = ["nalgebra_glam", "nalgebra_core", "nalgebra_static3", "glam_core@0.4.1"]
# WP 9-NS5: static 1-4 + geometry (docs/SPLIT.md §6.2, §12.4)
static4_geometry = ["nalgebra_core", "nalgebra_static3", "nalgebra_shapes5", "nalgebra_static4",
    "nalgebra_geometry4"]

# WP 9-NS9: the SVD / eigen, pivoting and factorisation closures (docs/SPLIT.md §6.2, §12.4)
static3_svd = ["nalgebra_core", "nalgebra_static3", "nalgebra_linalg_svd_eigen4"]
core_pivot = ["nalgebra_core", "nalgebra_linalg_pivot4"]
static4_factor = ["nalgebra_core", "nalgebra_static3", "nalgebra_shapes5", "nalgebra_static4",
    "nalgebra_linalg4"]
