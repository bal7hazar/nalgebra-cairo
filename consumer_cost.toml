# Gates and closures of scripts/consumer_cost.py (see the docstring at the top of that script).
# The values below are the defaults of the package granularity rule (a published crate: at most
# 40,000 library lines; an empty consumer of it adds at most 5 s / 1 GB to the no-dependency
# build; a typical closure at most 15 s / 3 GB).

# Crates judged on the closure budget only (gate 3): facades that re-export others (or
# `--facade umbrella` on the command line, repeatable). WP 9-NS11b: the facade `nalgebra` depends on
# every sub-crate (Scarb has no optional dependency), so it fails gate 3 by construction; the
# programme session accepted it (docs/SPLIT.md §12.1): measured and shown, never gated
# (`report_only`), the light builds depend on the sub-crates.
facades = ["nalgebra"]

[gates]
max_lines = 40000
max_seconds = 5
max_gb = 1
closure_seconds = 15
closure_gb = 3

[crates.nalgebra]
report_only = true

# "Typical closures": the crates a consumer of a product pulls in together, measured by one
# consumer that depends on all of them (`--closure NAME=a,b` adds more on the command line). A
# member is a workspace crate by name ("nalgebra_glam") or a registry crate with its version
# requirement ("glam@0.4.1", "fixed@0.4.0").
#
# A closure is a list of members, or a table `{ members = [..], default_features = false,
# features = [..], report_only = true }` (the configuration of its workspace members; a
# `report_only` closure is measured for the documentation, never gated). The table form may also carry
# its own budget instead of the default `closure_seconds` / `closure_gb`:
# `budget = { seconds = 20, gb = 4.5 }` (the dimension 5-6 closures, declared on the re-cut map).
[closures]
# The facade with `nalgebra_glam` and the facade without its default features (docs/SPLIT.md §4,
# §12.1: the cost regression of `default-features = false`): reported for the CHANGELOG.
nalgebra_with_glam = { members = ["nalgebra", "nalgebra_glam"], report_only = true }
facade_no_default_features = { members = ["nalgebra"], default_features = false, report_only = true }
# WP 9-NS4: `nalgebra_glam` on the sub-crates (docs/SPLIT.md §8)
# (WP 9-NS5: `glam_int` dropped, docs/SPLIT.md §15; WP 9-R1: its direct dependencies on the
# per-dimension map, docs/SPLIT.md §18.1)
nalgebra_glam = ["nalgebra_glam", "nalgebra_core", "nalgebra_types2", "nalgebra_types3", "nalgebra_types4",
    "nalgebra_static2", "nalgebra_static3", "nalgebra_geometry2", "nalgebra_geometry3", "glam_core@0.4.1"]
# WP 9-NS5: static 1-4 + geometry (docs/SPLIT.md §6.2, §12.4); WP 9-R1: static 2-4 + geometry 2-4
# + transforms 2-3 on the per-dimension map (docs/SPLIT.md §18.2); WP 9-R3: budgets declared below
# (15 s / 3 GB up to dimension 4)
static4_geometry = ["nalgebra_static4", "nalgebra_geometry2", "nalgebra_geometry3", "nalgebra_geometry4",
    "nalgebra_transform2", "nalgebra_transform3"]

# WP 9-NS9: the SVD / eigen, pivoting and factorisation closures (docs/SPLIT.md §6.2, §12.4); WP 9-R2:
# on the per-dimension decompositions (docs/SPLIT.md §18.2: static 2-3 + SVD / eigen 2-3, pivoting
# 2-4, static 2-4 + LU / Cholesky / QR 2-4); WP 9-R3: budgets declared below
static3_svd = ["nalgebra_static3", "nalgebra_linalg_svd_eigen2", "nalgebra_linalg_svd_eigen3"]
static4_svd = ["nalgebra_static4", "nalgebra_linalg_svd_eigen2", "nalgebra_linalg_svd_eigen3", "nalgebra_linalg_svd_eigen4"]
core_pivot = ["nalgebra_linalg_pivot2", "nalgebra_linalg_pivot3", "nalgebra_linalg_pivot4"]
static4_factor = ["nalgebra_static4", "nalgebra_linalg2", "nalgebra_linalg3", "nalgebra_linalg4"]
# WP 9-R3: static 2-3 + the 2D / 3D geometry (the dimension 2 / 3 knot broken, docs/SPLIT.md §18.3)
static3_geometry = ["nalgebra_static3", "nalgebra_geometry2", "nalgebra_geometry3"]

# WP 9-R3: the dimension 5-6 closures (docs/SPLIT.md §18.2, §19): types + methods of one dimension,
# with and without one decomposition family, at the budget of a closure with dimension 5 or 6
# (20 s / 4.5 GB on the runner; 15 s / 3 GB up to dimension 4 is the default of `[gates]`)
static5 = { members = ["nalgebra_static5"], budget = { seconds = 20, gb = 4.5 } }
static5_factor = { members = ["nalgebra_static5", "nalgebra_linalg5"], budget = { seconds = 20, gb = 4.5 } }
static5_svd = { members = ["nalgebra_static5", "nalgebra_linalg_svd_eigen5"], budget = { seconds = 20, gb = 4.5 } }
static5_pivot = { members = ["nalgebra_static5", "nalgebra_linalg_pivot5"], budget = { seconds = 20, gb = 4.5 } }
static5_spectral = { members = ["nalgebra_static5", "nalgebra_linalg_spectral5"], budget = { seconds = 20, gb = 4.5 } }
static5_geometry = { members = ["nalgebra_static5", "nalgebra_geometry5"], budget = { seconds = 20, gb = 4.5 } }
# `static6_wide` pulls `static6_tall`: the methods of every dimension-6 shape
static6 = { members = ["nalgebra_static6_wide"], budget = { seconds = 20, gb = 4.5 } }
static6_factor = { members = ["nalgebra_static6_wide", "nalgebra_linalg6"], budget = { seconds = 20, gb = 4.5 } }
static6_pivot = { members = ["nalgebra_static6_wide", "nalgebra_linalg_pivot6"], budget = { seconds = 20, gb = 4.5 } }
static6_geometry = { members = ["nalgebra_static6_wide", "nalgebra_geometry6"], budget = { seconds = 20, gb = 4.5 } }
# the dimension-6 decompositions alone: the decomposition crate with its types, without the
# dimension-6 method crates (docs/SPLIT.md §18.7.1; `pivot6` pulls `static6_wide` for `Perm6`)
svd_eigen6 = { members = ["nalgebra_linalg_svd_eigen6"], budget = { seconds = 20, gb = 4.5 } }
pivot6 = { members = ["nalgebra_linalg_pivot6"], budget = { seconds = 20, gb = 4.5 } }
# static 6 + SVD / eigen 6 and static 6 + spectral 6 exceed the dimension 5-6 budget by a little
# (21.5 s / 4.70 GB and 21.5 s / 4.64 GB on the runner): documented in the README, not gated
# (owner, docs/SPLIT.md §18.7.1)
static6_svd = { members = ["nalgebra_static6_wide", "nalgebra_linalg_svd_eigen6"], budget = { seconds = 20, gb = 4.5 }, report_only = true }
static6_spectral = { members = ["nalgebra_static6_wide", "nalgebra_linalg_spectral6"], budget = { seconds = 20, gb = 4.5 }, report_only = true }

# WP 9-R3: the families with static 2-4 (docs/SPLIT.md §18.4): statistics per dimension and BLAS fit
# the default budget; blocks, views and norm pull dimensions 5-6 (generic traits whose impls cannot
# be cut per dimension): advanced use, documented in the README, never gated (§18.7.3)
static4_statistics = ["nalgebra_static4", "nalgebra_statistics2", "nalgebra_statistics3", "nalgebra_statistics4"]
static4_statistics_all = ["nalgebra_static4", "nalgebra_statistics2", "nalgebra_statistics3", "nalgebra_statistics4", "nalgebra_statistics5", "nalgebra_statistics6"]
static4_blas = ["nalgebra_static4", "nalgebra_blas"]
static4_blocks = { members = ["nalgebra_static4", "nalgebra_blocks"], report_only = true }
static4_views = { members = ["nalgebra_static4", "nalgebra_views"], report_only = true }
static4_norm = { members = ["nalgebra_static4", "nalgebra_norm"], report_only = true }

# WP 9-R3: the reference for `nalgebra_glam`'s closure (the glam types alone), shown, never gated
glam_0_4_1_alone = { members = ["glam_core@0.4.1"], report_only = true }
