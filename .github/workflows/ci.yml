name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

defaults:
  run:
    shell: bash # enables pipefail

# The compiler is not deterministic on several threads (slingfall OPERATIONS.md): every build whose
# output is hashed or snapshotted runs single-threaded. The Consumer cost jobs, which time cold
# builds and hash nothing, set their own (the compiler's default threads).
env:
  RAYON_NUM_THREADS: "1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Once for the whole workspace (the shards below only test their package).
  workspace:
    name: Workspace (fmt, parity, generated code, lint, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: scarb
        continue-on-error: true
        uses: software-mansion/setup-scarb@2a96b748888e3329ee44ac9ac073d930e692b3cd # v1.6.2
      - if: steps.scarb.outcome == 'failure'
        run: sleep 20
      - if: steps.scarb.outcome == 'failure'
        uses: software-mansion/setup-scarb@2a96b748888e3329ee44ac9ac073d930e692b3cd # v1.6.2
      - name: Format, API parity and generated-code freshness
        run: |
          scarb fmt --check
          python3 scripts/api_parity.py --check
          python3 tools/shapegen/shapegen.py --check
          python3 tools/linalggen/generate.py --check
      - name: Library lines of the published crates (gate 1, enforced on the sub-crates)
        # The facade `nalgebra` is judged on gate 3 only (docs/SPLIT.md §12) and still hosts the
        # families not moved yet; every other published crate must stay at or under 40,000 lines,
        # so a generator change that grows `nalgebra_types6` (6.4 % margin: 37,436 lines) fails here.
        run: |
          python3 scripts/consumer_cost.py --lines-only --report-only --json lines.json
          python3 - <<'PY'
          import json, sys
          data = json.load(open("lines.json"))
          limit = data["gates"]["max_lines"]
          over = [(r["crate"], r["lines"]) for r in data["results"]
                  if r["crate"] != "nalgebra" and r["lines"] > limit]
          for crate, lines in over:
              print(f"::error::{crate}: {lines} library lines > {limit} (gate 1)")
          sys.exit(1 if over else 0)
          PY
      - name: Consumer cost and release scripts (self-test, consumer manifests of the dry run; no build)
        run: |
          python3 scripts/consumer_cost.py --self-test
          python3 scripts/release.py --self-test
          python3 scripts/packages_table.py --self-test
          python3 scripts/consumer_cost.py --dry-run --report-only
      - name: Lint (default features, then the lightest `nalgebra`)
        run: |
          scarb lint --deny-warnings
          scarb lint -p nalgebra --no-default-features --deny-warnings
      - name: Build the published crates (default features, then the lightest `nalgebra`, DESIGN D9)
        # Only the published crates (their sub-crate dependencies build with them): the ~60 test
        # packages are built by their own `library` shards and linted above. Building every package
        # of the growing workspace in this one job got the runner shut down (M9, 2026-09-29).
        run: |
          scarb build -p nalgebra -p nalgebra_glam
          scarb build -p nalgebra --no-default-features

  # Package granularity rule (docs/PLAN.md M9): the published crates against the size gates (lines,
  # cold-build time and memory an empty consumer adds, declared closures), scripts/consumer_cost.py,
  # ENFORCING since WP 9-NS11b. Every consumer is built cold 5 times in interleaved rounds and every
  # figure is the median of the per-round differences; the crates and closures are spread over
  # balanced shards (`--shard K/N`, deterministic, new crates included automatically), each with its
  # own baseline, and the job `Consumer cost` merges the shards into ONE verdict (the required check).
  # The facade and the closures that contain it are `report_only` in consumer_cost.toml (they fail
  # gate 3 by construction, docs/SPLIT.md §12.1).
  # Gate 2 (the marginal cost) is enforced since WP 9-NS12b: the transition switch
  # `--report-only-marginals` (WP 9-NS11b, owner decision 2026-09-29) was dropped once
  # `nalgebra_dynamic` was cut under the gate (docs/SPLIT.md §18.5). Lines (gate 1), marginals
  # (gate 2) and the declared closures (gate 3) are all enforced.
  consumer-cost-shard:
    name: Consumer cost shard (${{ matrix.shard }})
    runs-on: ubuntu-latest
    # Wall time and memory of cold builds, nothing hashed: the compiler's default threads ("0" =
    # all cores), as the gates were set; one thread doubles the times (CI run 37012930609, WP 10-TC).
    env:
      RAYON_NUM_THREADS: "0"
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: scarb2
        continue-on-error: true
        uses: software-mansion/setup-scarb@2a96b748888e3329ee44ac9ac073d930e692b3cd # v1.6.2
      - if: steps.scarb2.outcome == 'failure'
        run: sleep 20
      - if: steps.scarb2.outcome == 'failure'
        uses: software-mansion/setup-scarb@2a96b748888e3329ee44ac9ac073d930e692b3cd # v1.6.2
      - name: Measure the shard's crates and closures (cold builds, interleaved rounds)
        run: |
          [ -x /usr/bin/time ] || sudo apt-get install -y time > /dev/null
          echo "runner: $(nproc) vCPU, $(free -g | awk '/Mem:/ {print $2}') GB"
          python3 scripts/consumer_cost.py --report-only --repeat 5 --interleave \
            --shard "${{ matrix.shard }}/${{ strategy.job-total }}" \
            --json "consumer_cost_${{ matrix.shard }}.json" | tee consumer_cost.md
          { echo "### Consumer cost, shard ${{ matrix.shard }}/${{ strategy.job-total }}"; echo; cat consumer_cost.md; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: consumer-cost-shard-${{ matrix.shard }}
          path: consumer_cost_${{ matrix.shard }}.json
          if-no-files-found: error
          retention-days: 30

  consumer-cost:
    name: Consumer cost
    needs: consumer-cost-shard
    if: always()
    runs-on: ubuntu-latest
    # Wall time and memory of cold builds, nothing hashed: the compiler's default threads ("0" =
    # all cores), as the gates were set; one thread doubles the times (CI run 37012930609, WP 10-TC).
    env:
      RAYON_NUM_THREADS: "0"
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Every shard ran
        if: needs.consumer-cost-shard.result != 'success'
        run: |
          echo "::error::a Consumer cost shard did not complete (${{ needs.consumer-cost-shard.result }})"
          exit 1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: consumer-cost-shard-*
          path: shards
      - name: One table, one verdict (enforcing)
        run: |
          set +e
          python3 scripts/consumer_cost.py --merge shards/*/consumer_cost_*.json \
            --json consumer_cost.json | tee consumer_cost.md
          status=${PIPESTATUS[0]}
          set -e
          { echo "### Consumer cost"; echo; cat consumer_cost.md; } >> "$GITHUB_STEP_SUMMARY"
          exit $status
      - name: Package table (docs/PACKAGES.md format, artifact and job summary)
        if: always() && hashFiles('consumer_cost.json') != ''
        run: |
          python3 scripts/packages_table.py consumer_cost.json \
            --runner "ubuntu-latest, shards of $(nproc) vCPU / $(free -g | awk '/Mem:/ {print $2}') GB" \
            --output PACKAGES.md
          cat PACKAGES.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: consumer-cost
          path: |
            consumer_cost.json
            consumer_cost.md
            PACKAGES.md
          if-no-files-found: warn
          retention-days: 30

  # docs/SPLIT.md §17: the facade's no-op features (`statistics`, `blas`, `dynamic`, `sparse`, `io`)
  # stay declared in 0.1.1; two consumers naming them (with and without the default features) build.
  facade-features:
    name: Facade features
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: scarb3
        continue-on-error: true
        uses: software-mansion/setup-scarb@2a96b748888e3329ee44ac9ac073d930e692b3cd # v1.6.2
      - if: steps.scarb3.outcome == 'failure'
        run: sleep 20
      - if: steps.scarb3.outcome == 'failure'
        uses: software-mansion/setup-scarb@2a96b748888e3329ee44ac9ac073d930e692b3cd # v1.6.2
      - name: Consumers naming the no-op features build against the workspace facade
        run: python3 scripts/facade_features.py

  # Package split (docs/SPLIT.md §3.4, §12.3): the facade exports exactly the public paths of 0.1.0
  # (tools/split/public_paths_0.1.0.txt + public_paths_added.txt), and a consumer naming every one
  # of them, plus the usage checks, builds.
  path-proof:
    name: Path proof
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: scarb4
        continue-on-error: true
        uses: software-mansion/setup-scarb@2a96b748888e3329ee44ac9ac073d930e692b3cd # v1.6.2
      - if: steps.scarb4.outcome == 'failure'
        run: sleep 20
      - if: steps.scarb4.outcome == 'failure'
        uses: software-mansion/setup-scarb@2a96b748888e3329ee44ac9ac073d930e692b3cd # v1.6.2
      - name: Public paths of the facade against 0.1.0, consumer build
        run: python3 tools/split/public_paths.py --check

  library:
    name: Library (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # `filters`: snforge test filters run one after the other in the same job (a filter's cost is
        # proportional to the tests it selects; `--partition` would compile the whole package).
        include:
          - { name: nalgebra_testing, package: nalgebra_testing, filters: "nalgebra_testing" }
          # `nalgebra`: only the tests of crate-internal items (and the integration tests); the
          # public-API tests live in the test-only packages `nalgebra_tests_*` (WP 8.1c).
          # It runs without the Scarb features (`flags`) but the linalg ones its in-crate tests need
          # (`eigen`, `svd`, `qr`: the kernels of `SymmetricEigen2/3`, `Svd2/3`, `Qr2/3/4`, WP 8.5-P15):
          # the unit needs ~0.9 GB less than with the defaults.
          - { name: nalgebra, package: nalgebra, filters: "nalgebra", flags: "--no-default-features --features eigen,svd,qr" }
          # `nalgebra_glam` (WP 8.6-P19, DESIGN D11): the conversions and their tests / benchmarks.
          - { name: nalgebra_glam, package: nalgebra_glam, filters: "nalgebra_glam" }
          - { name: "tests_base vectors", package: nalgebra_tests_base, filters: "nalgebra_tests_base::vector" }
          - { name: "tests_base matrices", package: nalgebra_tests_base, filters: "nalgebra_tests_base::matrix nalgebra_tests_base::point nalgebra_tests_base::unit nalgebra_tests_base::cg" }
          - { name: "tests_geometry quaternions", package: nalgebra_tests_geometry, filters: "nalgebra_tests_geometry::quaternion nalgebra_tests_geometry::unit_quaternion" }
          - { name: "tests_geometry poses", package: nalgebra_tests_geometry, filters: "nalgebra_tests_geometry::isometry nalgebra_tests_geometry::rotation nalgebra_tests_geometry::similarity nalgebra_tests_geometry::translation nalgebra_tests_geometry::unit_complex" }
          - { name: tests_geometry_ext, package: nalgebra_tests_geometry_ext, filters: "nalgebra_tests_geometry_ext" }
          - { name: tests_geometry_poses, package: nalgebra_tests_geometry_poses, filters: "nalgebra_tests_geometry_poses" }
          - { name: tests_geometry_scale, package: nalgebra_tests_geometry_scale, filters: "nalgebra_tests_geometry_scale" }
          - { name: tests_geometry_dual, package: nalgebra_tests_geometry_dual, filters: "nalgebra_tests_geometry_dual" }
          - { name: tests_geometry_projections, package: nalgebra_tests_geometry_projections, filters: "nalgebra_tests_geometry_projections" }
          - { name: tests_geometry_transform, package: nalgebra_tests_geometry_transform, filters: "nalgebra_tests_geometry_transform" }
          - { name: tests_linalg, package: nalgebra_tests_linalg, filters: "nalgebra_tests_linalg" }
          - { name: tests_linalg_solve, package: nalgebra_tests_linalg_solve, filters: "nalgebra_tests_linalg_solve" }
          - { name: tests_linalg_solve_rhs, package: nalgebra_tests_linalg_solve_rhs, filters: "nalgebra_tests_linalg_solve_rhs" }
          - { name: tests_linalg_factor, package: nalgebra_tests_linalg_factor, filters: "nalgebra_tests_linalg_factor" }
          - { name: tests_linalg_eigen, package: nalgebra_tests_linalg_eigen, filters: "nalgebra_tests_linalg_eigen" }
          - { name: tests_linalg_qr, package: nalgebra_tests_linalg_qr, filters: "nalgebra_tests_linalg_qr" }
          - { name: tests_linalg_qr_tall, package: nalgebra_tests_linalg_qr_tall, filters: "nalgebra_tests_linalg_qr_tall" }
          - { name: tests_linalg_qr6, package: nalgebra_tests_linalg_qr6, filters: "nalgebra_tests_linalg_qr6" }
          - { name: tests_linalg_cholesky_update, package: nalgebra_tests_linalg_cholesky_update, filters: "nalgebra_tests_linalg_cholesky_update" }
          - { name: tests_linalg_svd, package: nalgebra_tests_linalg_svd, filters: "nalgebra_tests_linalg_svd" }
          - { name: tests_linalg_svd5, package: nalgebra_tests_linalg_svd5, filters: "nalgebra_tests_linalg_svd5" }
          - { name: tests_linalg_svd6, package: nalgebra_tests_linalg_svd6, filters: "nalgebra_tests_linalg_svd6" }
          - { name: tests_linalg_svd_tall, package: nalgebra_tests_linalg_svd_tall, filters: "nalgebra_tests_linalg_svd_tall" }
          - { name: tests_linalg_svd_tall5, package: nalgebra_tests_linalg_svd_tall5, filters: "nalgebra_tests_linalg_svd_tall5" }
          - { name: tests_linalg_svd_tall6, package: nalgebra_tests_linalg_svd_tall6, filters: "nalgebra_tests_linalg_svd_tall6" }
          - { name: tests_linalg_svd_tall6b, package: nalgebra_tests_linalg_svd_tall6b, filters: "nalgebra_tests_linalg_svd_tall6b" }
          - { name: tests_linalg_svd_wide, package: nalgebra_tests_linalg_svd_wide, filters: "nalgebra_tests_linalg_svd_wide" }
          - { name: tests_linalg_svd_wide5, package: nalgebra_tests_linalg_svd_wide5, filters: "nalgebra_tests_linalg_svd_wide5" }
          - { name: tests_linalg_svd_wide6, package: nalgebra_tests_linalg_svd_wide6, filters: "nalgebra_tests_linalg_svd_wide6" }
          - { name: tests_linalg_svd_wide6b, package: nalgebra_tests_linalg_svd_wide6b, filters: "nalgebra_tests_linalg_svd_wide6b" }
          - { name: tests_linalg_pivot_lu, package: nalgebra_tests_linalg_pivot_lu, filters: "nalgebra_tests_linalg_pivot_lu" }
          - { name: tests_linalg_pivot_lu_wide, package: nalgebra_tests_linalg_pivot_lu_wide, filters: "nalgebra_tests_linalg_pivot_lu_wide" }
          - { name: tests_linalg_pivot_lu_tall, package: nalgebra_tests_linalg_pivot_lu_tall, filters: "nalgebra_tests_linalg_pivot_lu_tall" }
          - { name: tests_linalg_pivot_qr, package: nalgebra_tests_linalg_pivot_qr, filters: "nalgebra_tests_linalg_pivot_qr" }
          - { name: tests_linalg_pivot_qr_wide, package: nalgebra_tests_linalg_pivot_qr_wide, filters: "nalgebra_tests_linalg_pivot_qr_wide" }
          - { name: tests_linalg_pivot_qr_tall, package: nalgebra_tests_linalg_pivot_qr_tall, filters: "nalgebra_tests_linalg_pivot_qr_tall" }
          - { name: tests_linalg_pivot_lblt, package: nalgebra_tests_linalg_pivot_lblt, filters: "nalgebra_tests_linalg_pivot_lblt" }
          - { name: tests_linalg_schur, package: nalgebra_tests_linalg_schur, filters: "nalgebra_tests_linalg_schur" }
          - { name: tests_linalg_schur56, package: nalgebra_tests_linalg_schur56, filters: "nalgebra_tests_linalg_schur56" }
          - { name: tests_linalg_exp, package: nalgebra_tests_linalg_exp, filters: "nalgebra_tests_linalg_exp" }
          - { name: tests_linalg_hessenberg, package: nalgebra_tests_linalg_hessenberg, filters: "nalgebra_tests_linalg_hessenberg" }
          - { name: tests_linalg_bidiagonal, package: nalgebra_tests_linalg_bidiagonal, filters: "nalgebra_tests_linalg_bidiagonal" }
          - { name: tests_linalg_bidiagonal_wide, package: nalgebra_tests_linalg_bidiagonal_wide, filters: "nalgebra_tests_linalg_bidiagonal_wide" }
          - { name: tests_linalg_bidiagonal_tall, package: nalgebra_tests_linalg_bidiagonal_tall, filters: "nalgebra_tests_linalg_bidiagonal_tall" }
          - { name: tests_dynamic, package: nalgebra_tests_dynamic, filters: "nalgebra_tests_dynamic" }
          - { name: tests_sparse, package: nalgebra_tests_sparse, filters: "nalgebra_tests_sparse" }
          - { name: tests_root, package: nalgebra_tests_root, filters: "nalgebra_tests_root" }
          - { name: "shapes core", package: nalgebra_shapes_tests_core, filters: "nalgebra_shapes_tests_core" }
          - { name: "shapes norms", package: nalgebra_shapes_tests_norms, filters: "nalgebra_shapes_tests_norms" }
          - { name: "shapes componentwise", package: nalgebra_shapes_tests_componentwise, filters: "nalgebra_shapes_tests_componentwise" }
          - { name: "shapes construction", package: nalgebra_shapes_tests_construction, filters: "nalgebra_shapes_tests_construction" }
          - { name: "shapes structure", package: nalgebra_shapes_tests_structure, filters: "nalgebra_shapes_tests_structure" }
          - { name: "shapes functional", package: nalgebra_shapes_tests_functional, filters: "nalgebra_shapes_tests_functional" }
          - { name: "shapes edition", package: nalgebra_shapes_tests_edition, filters: "nalgebra_shapes_tests_edition" }
          - { name: "shapes inplace", package: nalgebra_shapes_tests_inplace, filters: "nalgebra_shapes_tests_inplace" }
          - { name: "shapes views", package: nalgebra_shapes_tests_views, filters: "nalgebra_shapes_tests_views" }
          - { name: "shapes blocks", package: nalgebra_shapes_tests_blocks, filters: "nalgebra_shapes_tests_blocks" }
          - { name: "shapes cg", package: nalgebra_shapes_tests_cg, filters: "nalgebra_shapes_tests_cg" }
          - { name: "shapes stats", package: nalgebra_shapes_tests_stats, filters: "nalgebra_shapes_tests_stats" }
          - { name: "shapes blas", package: nalgebra_shapes_tests_blas, filters: "nalgebra_shapes_tests_blas" }
          - { name: "shapes gemm", package: nalgebra_shapes_tests_gemm, filters: "nalgebra_shapes_tests_gemm" }
          - { name: "shapes gemm large", package: nalgebra_shapes_tests_gemm_large, filters: "nalgebra_shapes_tests_gemm_large" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: scarb5
        continue-on-error: true
        uses: software-mansion/setup-scarb@2a96b748888e3329ee44ac9ac073d930e692b3cd # v1.6.2
      - if: steps.scarb5.outcome == 'failure'
        run: sleep 20
      - if: steps.scarb5.outcome == 'failure'
        uses: software-mansion/setup-scarb@2a96b748888e3329ee44ac9ac073d930e692b3cd # v1.6.2
      - id: snfoundry
        continue-on-error: true
        uses: foundry-rs/setup-snfoundry@16e23ddd0e2845f38727c92f4b913a7b728cda9e # v6.0.0
      - if: steps.snfoundry.outcome == 'failure'
        run: sleep 20
      - if: steps.snfoundry.outcome == 'failure'
        uses: foundry-rs/setup-snfoundry@16e23ddd0e2845f38727c92f4b913a7b728cda9e # v6.0.0
      - name: Test the shard and check the benchmarks it ran against the snapshot
        run: |
          : > snforge.out
          for filter in ${{ matrix.filters }}; do
            snforge test -p "${{ matrix.package }}" ${{ matrix.flags }} "$filter" | tee -a snforge.out >&2
          done
          python3 scripts/gas_report.py --check gas/ --partial < snforge.out
          grep -E "^\[PASS\].*::bench_" snforge.out > bench.out || true
          grep -E "^Tests: " snforge.out | sed "s/^/${{ matrix.package }} /" > coverage.out
          echo "artifact=bench-${{ strategy.job-index }}" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.artifact }}
          path: |
            bench.out
            coverage.out
          if-no-files-found: error
          retention-days: 1

  gas:
    name: Gas snapshot
    needs: library
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: bench-*
          path: bench
      - name: Every benchmark of every shard against the full snapshot (catches removed benchmarks)
        run: cat bench/*/bench.out | python3 scripts/gas_report.py --check gas/
      - name: Every test of every package runs in exactly one shard (catches modules no filter selects)
        run: cat bench/*/coverage.out | python3 scripts/shard_coverage.py

  benchmarks:
    name: Design benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: changes
        with:
          filters: |
            benchmarks:
              - 'benchmarks/**'
              - 'scripts/gas_report.py'
              - '.tool-versions'
      - id: scarb6
        if: steps.changes.outputs.benchmarks == 'true'
        continue-on-error: true
        uses: software-mansion/setup-scarb@2a96b748888e3329ee44ac9ac073d930e692b3cd # v1.6.2
      - if: steps.scarb6.outcome == 'failure'
        run: sleep 20
      - if: steps.scarb6.outcome == 'failure'
        uses: software-mansion/setup-scarb@2a96b748888e3329ee44ac9ac073d930e692b3cd # v1.6.2
      - id: snfoundry2
        if: steps.changes.outputs.benchmarks == 'true'
        continue-on-error: true
        uses: foundry-rs/setup-snfoundry@16e23ddd0e2845f38727c92f4b913a7b728cda9e # v6.0.0
      - if: steps.snfoundry2.outcome == 'failure'
        run: sleep 20
      - if: steps.snfoundry2.outcome == 'failure'
        uses: foundry-rs/setup-snfoundry@16e23ddd0e2845f38727c92f4b913a7b728cda9e # v6.0.0
      - name: Workspace benchmarks
        if: steps.changes.outputs.benchmarks == 'true'
        working-directory: benchmarks
        run: |
          scarb fmt --check
          snforge test --workspace | python3 scripts/gas_report.py --check gas/
      # benchmarks/libs stays on Scarb 2.19.4 / starknet-foundry 0.61.0 (its own .tool-versions): a frozen
      # comparison of vendored third-party libraries (cubit, orion) that corelib 2.20.0 no longer compiles
      # (u32_as_non_zero / u64_as_non_zero removed); patching them would change the compared figures.
      - id: scarb7
        if: steps.changes.outputs.benchmarks == 'true'
        continue-on-error: true
        uses: software-mansion/setup-scarb@2a96b748888e3329ee44ac9ac073d930e692b3cd # v1.6.2
        with:
          tool-versions: benchmarks/libs/.tool-versions
      - if: steps.scarb7.outcome == 'failure'
        run: sleep 20
      - if: steps.scarb7.outcome == 'failure'
        uses: software-mansion/setup-scarb@2a96b748888e3329ee44ac9ac073d930e692b3cd # v1.6.2
        with:
          tool-versions: benchmarks/libs/.tool-versions
      - id: snfoundry3
        if: steps.changes.outputs.benchmarks == 'true'
        continue-on-error: true
        uses: foundry-rs/setup-snfoundry@16e23ddd0e2845f38727c92f4b913a7b728cda9e # v6.0.0
        with:
          tool-versions: benchmarks/libs/.tool-versions
      - if: steps.snfoundry3.outcome == 'failure'
        run: sleep 20
      - if: steps.snfoundry3.outcome == 'failure'
        uses: foundry-rs/setup-snfoundry@16e23ddd0e2845f38727c92f4b913a7b728cda9e # v6.0.0
        with:
          tool-versions: benchmarks/libs/.tool-versions
      - name: Third-party library benchmarks
        if: steps.changes.outputs.benchmarks == 'true'
        working-directory: benchmarks/libs
        run: |
          scarb fmt --check
          snforge test | python3 ../scripts/gas_report.py --check gas/

  oracle:
    name: Oracle (golden vectors)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: changes
        with:
          filters: |
            oracle:
              - 'tools/oracle/**'
      - name: Format, lint, test and check that committed vectors are up to date
        if: steps.changes.outputs.oracle == 'true'
        working-directory: tools/oracle
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test
          cargo run --release -- check
