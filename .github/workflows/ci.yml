name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

defaults:
  run:
    shell: bash # enables pipefail

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  library:
    name: Library (${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # "<filter> <index>/<total>" runs one `snforge --partition` of a shard (large shards only).
        shard: [simba, nalgebra_testing, "nalgebra::base 1/2", "nalgebra::base 2/2", nalgebra::geometry, nalgebra::linalg, integration]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: software-mansion/setup-scarb@2a96b748888e3329ee44ac9ac073d930e692b3cd # v1.6.2
      - uses: foundry-rs/setup-snfoundry@16e23ddd0e2845f38727c92f4b913a7b728cda9e # v6.0.0
      - name: Format, lint, build
        run: |
          scarb fmt --check
          scarb lint --deny-warnings
          scarb build
      - name: Test the shard and check its slice of the gas snapshot
        run: |
          shard="${{ matrix.shard }}"
          if [[ "$shard" == integration ]]; then
            # crates/nalgebra/tests: public-API tests, no benchmarks, no gas slice.
            snforge test -p nalgebra nalgebra_integrationtest
            exit 0
          fi
          filter="${shard%% *}"
          package="${filter%%::*}"
          if [[ "$shard" == *" "* ]]; then
            partition="${shard#* }"
            snforge test -p "$package" "$filter" --partition "$partition" | tee snforge.out /dev/stderr \
              | python3 scripts/gas_report.py --check gas/ --filter "$filter" --partial
          else
            snforge test -p "$package" "$filter" | tee snforge.out /dev/stderr \
              | python3 scripts/gas_report.py --check gas/ --filter "$filter"
          fi
      - name: Keep the benchmark lines for the full snapshot check
        if: matrix.shard != 'integration'
        run: |
          grep -E "^\[PASS\].*::bench_" snforge.out > bench.out || true
          echo "artifact=bench-$(echo '${{ matrix.shard }}' | tr ':/ ' '--_')" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: matrix.shard != 'integration'
        with:
          name: ${{ env.artifact }}
          path: bench.out
          retention-days: 1

  gas:
    name: Gas snapshot
    needs: library
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: bench-*
          path: bench
      - name: Every benchmark of every shard against the full snapshot (catches removed benchmarks)
        run: cat bench/*/bench.out | python3 scripts/gas_report.py --check gas/

  benchmarks:
    name: Design benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: changes
        with:
          filters: |
            benchmarks:
              - 'benchmarks/**'
              - 'scripts/gas_report.py'
              - '.tool-versions'
      - uses: software-mansion/setup-scarb@2a96b748888e3329ee44ac9ac073d930e692b3cd # v1.6.2
        if: steps.changes.outputs.benchmarks == 'true'
      - uses: foundry-rs/setup-snfoundry@16e23ddd0e2845f38727c92f4b913a7b728cda9e # v6.0.0
        if: steps.changes.outputs.benchmarks == 'true'
      - name: Workspace benchmarks
        if: steps.changes.outputs.benchmarks == 'true'
        working-directory: benchmarks
        run: |
          scarb fmt --check
          snforge test --workspace | python3 scripts/gas_report.py --check gas/
      - name: Third-party library benchmarks
        if: steps.changes.outputs.benchmarks == 'true'
        working-directory: benchmarks/libs
        run: |
          scarb fmt --check
          snforge test | python3 ../scripts/gas_report.py --check gas/

  oracle:
    name: Oracle (golden vectors)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: changes
        with:
          filters: |
            oracle:
              - 'tools/oracle/**'
      - name: Format, lint, test and check that committed vectors are up to date
        if: steps.changes.outputs.oracle == 'true'
        working-directory: tools/oracle
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test
          cargo run --release -- check
