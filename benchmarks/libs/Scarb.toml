# Standalone package (excluded from the parent workspace): gas benchmarks of EXISTING Cairo libraries.
[package]
name = "libs"
version = "0.1.0"
edition = "2024_07"
cairo-version = "2.19.4"

[dependencies]
harness = { path = "../harness" }
cubit = { path = "vendor/cubit" }
origami_algebra = { path = "vendor/origami_algebra" }
orion = { path = "vendor/orion" }
alexandria_math = "0.10.0"
alexandria_linalg = "0.10.0"

[dev-dependencies]
snforge_std = "0.61.0"
assert_macros = "2.19.4"

[tool.scarb]
allow-prebuilt-plugins = ["snforge_std"]
