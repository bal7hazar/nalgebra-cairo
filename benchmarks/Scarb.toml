# Standalone workspace: exploratory gas micro-benchmarks used to drive design decisions.
# Kept separate from the library workspace so third-party reference libraries never leak into it.
# `libs/` is a standalone package on purpose (third-party and vendored code): it is not a member.
[workspace]
members = ["harness", "primitives", "scalar", "layout"]

[workspace.package]
version = "0.1.0"
edition = "2024_07"
cairo-version = "2.19.4"

[workspace.dependencies]
snforge_std = "0.61.0"
assert_macros = "2.19.4"

[workspace.tool.scarb]
allow-prebuilt-plugins = ["snforge_std"]
