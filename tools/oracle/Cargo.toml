[package]
name = "nalgebra-oracle"
version = "0.1.0"
edition = "2021"
description = "Golden test vector generator for nalgebra.cairo: upstream nalgebra (f64) on inputs quantised to Q32.32"
license = "MIT"
publish = false

[[bin]]
name = "oracle"
path = "src/main.rs"

# Standalone crate: never part of a cargo workspace.
[workspace]

[dependencies]
# no `std` feature: keeps `matrixmultiply` (runtime CPU dispatch, FMA) out of the build;
# `libm-force`: every transcendental goes through the pure-Rust `libm`, not the platform libm.
nalgebra = { version = "=0.35.0", default-features = false, features = ["alloc", "libm-force"] }
libm = "0.2"
num-traits = { version = "0.2", default-features = false, features = ["libm"] }
rand_chacha = { version = "0.9", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev]
opt-level = 1
